# Temporary: runs the refresh script against the live page on this branch.
name: Probe banner sources
on:
  push:
    branches: [claude/project-thread-ypfaci]
    paths: [.github/workflows/probe-sources.yml, scripts/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-banners.mjs && sed -n '/= {/,$p' banner-data.js
