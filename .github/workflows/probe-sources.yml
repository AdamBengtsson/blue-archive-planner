# Temporary: dumps the raw source pages into the log so the parser can be written against them.
name: Probe banner sources
on:
  push:
    branches: [claude/project-thread-ypfaci]
    paths: [.github/workflows/probe-sources.yml, scripts/probe.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -m 60 -A "Mozilla/5.0" https://ba.joexyz.online/global/banners -o joe.html
          python3 scripts/probe.py joe.html
